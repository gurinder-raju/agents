[project]
name = "hello-agent"
version = "0.1.0"
description = "A generic hello-world agent for learning the agent stack one layer at a time."
requires-python = ">=3.12"
dependencies = [
    "strands-agents[ollama]>=1.62,<2",
    "httpx>=0.28,<1",
]

[project.scripts]
hello-agent = "hello_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
