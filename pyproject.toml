[project]
name = "agent-v3"
version = "0.1.0"
description = "An experimental, portable agent design: one agent that runs locally on Ollama or in the cloud on AWS Bedrock and AgentCore."
requires-python = ">=3.12"
dependencies = [
    "strands-agents[ollama]>=1.62,<2",
    "httpx>=0.28,<1",
]

[project.scripts]
agent-v3 = "agent_v3.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
