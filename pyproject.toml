[project]
name = "fetcher"
version = "0.1.0"
description = "An experimental, portable agent design: one agent that runs locally on Ollama or in the cloud on AWS Bedrock and AgentCore."
requires-python = ">=3.12"
dependencies = [
    "strands-agents[ollama]>=1.62,<2",
    "httpx>=0.28,<1",
    "boto3>=1.40,<2",
]

[project.scripts]
fetcher = "fetcher.cli:main"
fetcher-gateway = "fetcher.gateway_transport:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
